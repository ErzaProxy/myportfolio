<div id="add-art-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="add-art-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-art-modal" popovertargetaction="hide" aria-label="Tutup form tambah karya"></button>
    
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-art-modal" popovertargetaction="hide" aria-label="Tutup form tambah karya">×</button>
        <h2 id="add-art-modal-title">Tambah Karya Baru</h2>
        
        <form id="art-form" method="post" action="{% url 'main:create_art' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}
            
            <div class="project-form-modal__actions">
                <button type="button" class="cancel-btn" popovertarget="add-art-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="add-art-btn">Simpan Karya</button>
            </div>
        </form>
    </div>
</div>
