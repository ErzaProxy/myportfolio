{% extends 'base.html' %}

{% block meta %}
<link rel="stylesheet" href="/static/css/me.css">
{% endblock meta %}
{% block title %}{{ name }} - Main Menu{% endblock title %}

{% block layout %}
<main class="menu-wrap">
    <input type="radio" name="menu-nav" id="nav-about" checked>
    <input type="radio" name="menu-nav" id="nav-exp">
    <input type="radio" name="menu-nav" id="nav-art">
    <input type="radio" name="menu-nav" id="nav-proj">

    <div class="carousel-backgrounds">
        <img src="/static/img/menu/about.png" class="bg-img bg-about" alt="About">
        <img src="/static/img/menu/experience.png" class="bg-img bg-exp" alt="Experience">
        <img src="/static/img/menu/artfolio.png" class="bg-img bg-art" alt="Artfolio">
        <img src="/static/img/menu/projects.png" class="bg-img bg-proj" alt="Projects">
    </div>

    <img src="/static/img/menu/frame1.svg" alt="" class="master-frame">

    <header class="menu-header">
        <a href="{% url 'main:show_main' %}" class="back-btn"></a>
        <h1 class="main-title">Main Menu</h1>
    </header>

    <div class="chibi-icon"></div>
    <a href="{% url 'main:show_contact' %}" class="contact-btn"></a>

    <div class="carousel-contents">
        <div class="menu-slide slide-about-content">
            <h2 class="section-title">ABOUT ME</h2>
            <div class="bottom-nav">
                <label for="nav-proj" class="nav-arrow arrow-left"></label>
                <label for="nav-proj" class="nav-pill inactive-pill">Projects</label>
                <a href="{% url 'main:show_about' %}" class="nav-pill active-pill">About Me</a>
                <label for="nav-exp" class="nav-pill inactive-pill">Experience</label>
                <label for="nav-exp" class="nav-arrow arrow-right"></label>
            </div>
        </div>

        <div class="menu-slide slide-exp-content">
            <h2 class="section-title">EXPERIENCE</h2>
            <div class="bottom-nav">
                <label for="nav-about" class="nav-arrow arrow-left"></label>
                <label for="nav-about" class="nav-pill inactive-pill">About Me</label>
                <a href="{% url 'main:show_experience' %}" class="nav-pill active-pill">Experience</a>
                <label for="nav-art" class="nav-pill inactive-pill">Artfolio</label>
                <label for="nav-art" class="nav-arrow arrow-right"></label>
            </div>
        </div>

        <div class="menu-slide slide-art-content">
            <h2 class="section-title">ARTFOLIO</h2>
            <div class="bottom-nav">
                <label for="nav-exp" class="nav-arrow arrow-left"></label>
                <label for="nav-exp" class="nav-pill inactive-pill">Experience</label>
                <a href="{% url 'main:show_artfolio' %}" class="nav-pill active-pill">Artfolio</a>
                <label for="nav-proj" class="nav-pill inactive-pill">Projects</label>
                <label for="nav-proj" class="nav-arrow arrow-right"></label>
            </div>
        </div>

        <div class="menu-slide slide-proj-content">
            <h2 class="section-title">PROJECTS</h2>
            <div class="bottom-nav">
                <label for="nav-art" class="nav-arrow arrow-left"></label>
                <label for="nav-art" class="nav-pill inactive-pill">Artfolio</label>
                <a href="{% url 'main:show_project' %}" class="nav-pill active-pill">Projects</a>
                <label for="nav-about" class="nav-pill inactive-pill">About Me</label>
                <label for="nav-about" class="nav-arrow arrow-right"></label>
            </div>
        </div>
    </div>
</main>
{% endblock layout %}
